title: PVEKube
description: Single-binary Kubernetes cluster manager for Proxmox via Cluster API
baseurl: "/pvekube"
url: https://mevijays.github.io
repository: mevijays/pvekube

theme: jekyll-theme-primer
plugins:
  - jekyll-seo-tag
  - jekyll-feed

# Site navigation
navigation:
  - title: Home
    url: /
  - title: Getting Started
    url: /installation/
  - title: Architecture
    url: /architecture/
  - title: Features
    url: /features/
  - title: API Reference
    url: /api-reference/
  - title: Troubleshooting
    url: /troubleshooting/
  - title: GitHub
    url: https://github.com/mevijays/pvekube

exclude:
  - .gitignore
  - .github
  - Gemfile
  - Gemfile.lock
  - vendor/
  - node_modules/
