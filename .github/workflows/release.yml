name: Release Binaries

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          check-latest: true

      - name: Build cross-platform binaries
        run: |
          mkdir -p dist
          
          echo "Building Linux amd64..."
          GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o dist/pvekube-linux-amd64 ./cmd/pvekube

          echo "Building Linux arm64..."
          GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o dist/pvekube-linux-arm64 ./cmd/pvekube

          echo "Building macOS amd64..."
          GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w" -o dist/pvekube-darwin-amd64 ./cmd/pvekube

          echo "Building macOS arm64..."
          GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o dist/pvekube-darwin-arm64 ./cmd/pvekube

          echo "Building Windows amd64..."
          GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o dist/pvekube-windows-amd64.exe ./cmd/pvekube

          echo "Generating SHA256 checksums..."
          cd dist
          sha256sum * > checksums.txt
          cd ..

      - name: Create Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/pvekube-linux-amd64
            dist/pvekube-linux-arm64
            dist/pvekube-darwin-amd64
            dist/pvekube-darwin-arm64
            dist/pvekube-windows-amd64.exe
            dist/checksums.txt
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
