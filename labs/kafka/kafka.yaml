# Kafka LAB - 3 broker KRaft cluster (broker+controller on each node), no ZooKeeper.
apiVersion: v1
kind: Namespace
metadata:
  name: kafka
  labels:
    istio-injection: disabled   # keep the Istio sidecar out of Kafka's TCP traffic
---
# Headless service: gives each pod a stable DNS name kafka-0.kafka-headless.kafka.svc...
apiVersion: v1
kind: Service
metadata:
  name: kafka-headless
  namespace: kafka
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: kafka
  ports:
    - name: client
      port: 9092
    - name: controller
      port: 9093
---
# Normal ClusterIP service used only as the bootstrap address by clients in the cluster.
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: kafka
spec:
  selector:
    app: kafka
  ports:
    - name: client
      port: 9092
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: kafka
  namespace: kafka
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: kafka
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: kafka
spec:
  serviceName: kafka-headless
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      securityContext:
        fsGroup: 1000
      affinity:
        podAntiAffinity:            # one broker per worker node
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: kafka
              topologyKey: kubernetes.io/hostname
      terminationGracePeriodSeconds: 60
      containers:
        - name: kafka
          image: apache/kafka:4.0.0
          command: ["/bin/bash", "-c"]
          args:
            - |
              # node.id = pod ordinal (kafka-0 -> 0); advertise this pod's own DNS name
              export KAFKA_NODE_ID="${HOSTNAME##*-}"
              export KAFKA_ADVERTISED_LISTENERS="PLAINTEXT://${HOSTNAME}.kafka-headless.kafka.svc.cluster.local:9092"
              exec /etc/kafka/docker/run
          ports:
            - {name: client, containerPort: 9092}
            - {name: controller, containerPort: 9093}
          env:
            - {name: CLUSTER_ID, value: "MkU3OEVBNTcwNTJENDM2Qk"}
            - {name: KAFKA_PROCESS_ROLES, value: "broker,controller"}
            - {name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "0@kafka-0.kafka-headless.kafka.svc.cluster.local:9093,1@kafka-1.kafka-headless.kafka.svc.cluster.local:9093,2@kafka-2.kafka-headless.kafka.svc.cluster.local:9093"}
            - {name: KAFKA_LISTENERS, value: "PLAINTEXT://:9092,CONTROLLER://:9093"}
            - {name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"}
            - {name: KAFKA_CONTROLLER_LISTENER_NAMES, value: "CONTROLLER"}
            - {name: KAFKA_INTER_BROKER_LISTENER_NAME, value: "PLAINTEXT"}
            - {name: KAFKA_LOG_DIRS, value: "/var/lib/kafka/data"}
            # --- resiliency defaults ---
            - {name: KAFKA_DEFAULT_REPLICATION_FACTOR, value: "3"}
            - {name: KAFKA_MIN_INSYNC_REPLICAS, value: "2"}
            - {name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "3"}
            - {name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "3"}
            - {name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "2"}
            - {name: KAFKA_NUM_PARTITIONS, value: "3"}
            # --- lab behaviour: create topics explicitly so you learn how ---
            - {name: KAFKA_AUTO_CREATE_TOPICS_ENABLE, value: "false"}
            - {name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS, value: "0"}
            # --- retention defaults (per-topic overrides are covered in the guide) ---
            - {name: KAFKA_LOG_RETENTION_HOURS, value: "168"}        # 7 days
            - {name: KAFKA_LOG_SEGMENT_BYTES, value: "104857600"}    # 100 MiB segments
            - {name: KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS, value: "60000"}
            - {name: KAFKA_HEAP_OPTS, value: "-Xms512m -Xmx512m"}
          resources:
            requests: {cpu: 250m, memory: 1Gi}
            limits: {memory: 1536Mi}
          readinessProbe:
            tcpSocket: {port: 9092}
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            tcpSocket: {port: 9092}
            initialDelaySeconds: 60
            periodSeconds: 20
          volumeMounts:
            # subPath: the ext4 volume root contains lost+found, which Kafka refuses to start with
            - {name: data, mountPath: /var/lib/kafka/data, subPath: kafka}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: ceph-block
        resources:
          requests:
            storage: 5Gi
---
# Long-lived pod that has all the Kafka CLI tools. You kubectl exec into this.
apiVersion: v1
kind: Pod
metadata:
  name: kafka-client
  namespace: kafka
  labels:
    app: kafka-client
spec:
  containers:
    - name: client
      image: apache/kafka:4.0.0
      command: ["sleep", "infinity"]
      env:
        - {name: BS, value: "kafka-0.kafka-headless.kafka.svc.cluster.local:9092,kafka-1.kafka-headless.kafka.svc.cluster.local:9092,kafka-2.kafka-headless.kafka.svc.cluster.local:9092"}
      resources:
        requests: {cpu: 50m, memory: 128Mi}
