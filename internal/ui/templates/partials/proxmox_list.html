{{define "proxmox_list"}}
<div class="space-y-6">
  {{if not .Connections}}
  <div class="rounded-xl border border-amber-900 bg-amber-950/20 px-4 py-3 text-sm text-amber-200">
    <i class="fa fa-exclamation-triangle mr-2"></i>No Proxmox hosts connected yet — add one below.
  </div>
  {{else}}
  <div class="space-y-3">
    {{range .Connections}}
    <div class="rounded-xl border border-slate-800 bg-slate-900/40 p-4">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="flex h-8 w-8 items-center justify-center rounded-full bg-emerald-600">
            <i class="fa fa-check text-white"></i>
          </div>
          <div>
            <div class="font-medium text-white">
              {{.URL}}
              {{if .IsPrimary}}<span class="ml-1.5 rounded bg-slate-800 px-1.5 py-0.5 text-xs text-slate-400">primary</span>{{end}}
            </div>
            <div class="text-sm text-slate-400">token {{.TokenID}}</div>
          </div>
        </div>
        <div class="flex gap-2">
          <button type="button"
                  onclick="var d=document.getElementById('conn-detail-{{.ID}}'); d.classList.toggle('hidden'); if(!d.classList.contains('hidden') && !d.dataset.loaded){ htmx.trigger(d, 'load'); d.dataset.loaded='1'; }"
                  class="rounded-lg border border-slate-700 px-3 py-1.5 text-sm text-slate-300 hover:bg-slate-800">
            <i class="fa fa-list-ul mr-1.5"></i>Manage
          </button>
          <button hx-post="/proxmox/{{.ID}}/disconnect" hx-target="#proxmox-panel" hx-swap="innerHTML"
                  hx-vals='{"csrf": "{{$.CSRF}}"}'
                  hx-confirm="Disconnect {{.URL}}? Real VMs on Proxmox are NOT touched — only PVEKube's local record of this host, and any templates/clusters it tracked here, are removed.{{if .IsPrimary}} This is your PRIMARY connection: disconnecting it also permanently stops credential refresh for clusters created before multi-host support (e.g. myk8s) — they'll keep running, but PVEKube can no longer re-sync their credentials.{{end}}"
                  class="rounded-lg border border-red-900 px-3 py-1.5 text-sm text-red-300 hover:bg-red-950/40">
            Disconnect
          </button>
        </div>
      </div>
      <div id="conn-detail-{{.ID}}" class="hidden mt-4" hx-get="/proxmox/{{.ID}}/detail" hx-trigger="load" hx-swap="innerHTML">
        <div class="flex items-center gap-2 text-sm text-slate-500"><i class="fa fa-spinner fa-spin"></i> Loading…</div>
      </div>
    </div>
    {{end}}
  </div>
  {{end}}

  <div id="proxmox-add-toggle">
    <button type="button" onclick="document.getElementById('proxmox-add-toggle').classList.add('hidden'); document.getElementById('proxmox-add-form').classList.remove('hidden');"
            class="rounded-lg bg-brand-600 px-4 py-2.5 text-sm font-semibold text-white hover:bg-brand-700">
      <i class="fa fa-plus mr-1.5"></i>Add Proxmox host
    </button>
  </div>
  <div id="proxmox-add-form" class="hidden">
    <div class="mb-2 flex items-center justify-between">
      <h2 class="text-sm font-semibold uppercase tracking-wide text-slate-400">Add a Proxmox host</h2>
      <button type="button" onclick="document.getElementById('proxmox-add-form').classList.add('hidden'); document.getElementById('proxmox-add-toggle').classList.remove('hidden');"
              class="text-sm text-slate-500 hover:text-slate-300">
        <i class="fa fa-times mr-1"></i>Cancel
      </button>
    </div>
    {{template "proxmox_form" .}}
  </div>
</div>
{{end}}
