{{define "proxmox_detail_error"}}
<div class="flex items-start justify-between gap-3 rounded-lg border border-red-900 bg-red-950/50 px-3 py-2 text-sm text-red-300">
  <div class="flex items-start gap-2">
    <i class="fa fa-exclamation-circle mt-0.5"></i><span>{{.Error}}</span>
  </div>
  <button hx-post="/proxmox/{{.Conn.ID}}/refresh" hx-target="#conn-detail-{{.Conn.ID}}" hx-swap="innerHTML"
          class="flex-none rounded-lg border border-red-800 px-2.5 py-1 text-xs text-red-200 hover:bg-red-900/40">
    <i class="fa fa-refresh mr-1"></i>Retry
  </button>
</div>
{{end}}
