{{define "title"}}Prerequisites · PVEKube{{end}}
{{define "body"}}
{{template "nav" .}}
<div class="mx-auto max-w-4xl px-4 py-10" x-data>
  <div class="flex items-center justify-between">
    <div>
      <h1 class="text-2xl font-semibold text-white">Prerequisites</h1>
      <p class="mt-1 text-slate-400">Everything below must be green before you can build a template or launch a cluster.</p>
    </div>
    <button hx-post="/prereqs/refresh" hx-target="#checklist" hx-swap="outerHTML"
            class="rounded-lg border border-slate-700 px-3 py-2 text-sm text-slate-300 hover:bg-slate-800">
      <i class="fa fa-refresh mr-1.5"></i>Re-check all
    </button>
  </div>

  <div id="checklist" class="mt-6 space-y-3" hx-get="/prereqs/list" hx-trigger="load" hx-swap="outerHTML">
    <div class="flex items-center gap-2 text-sm text-slate-500">
      <i class="fa fa-spinner fa-spin"></i> Running checks…
    </div>
  </div>
</div>
{{end}}
